services:
  postgres:
    image: postgres:13-alpine
    container_name: ems-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: employees_management_system
    volumes:
      - postgres-data:/var/lib/postgresql/data
      #- ./postgres.conf:/etc/postgresql/postgresql.conf
    #command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d employees_management_system" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    image: djimy87/ems-app:v1
    container_name: ems-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/employees_management_system
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:

