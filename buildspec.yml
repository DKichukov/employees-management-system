version: 0.2
env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    ECR_REPOSITORY_URI: $ECR_REPOSITORY_URI
    AWS_REGION: $AWS_DEFAULT_REGION
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $ECR_REPOSITORY_URI:latest .
      - docker tag $ECR_REPOSITORY_URI:latest $ECR_REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $ECR_REPOSITORY_URI:latest
      - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file...
      - echo "{\"ImageURI\":\"$ECR_REPOSITORY_URI:$IMAGE_TAG\"}" > imageDefinitions.json
      - mkdir -p scripts

      # Create install_dependencies.sh
      - |
        cat > scripts/install_dependencies.sh << 'EOL'
        #!/bin/bash
        echo "Installing dependencies..."
        yum update -y
        yum install -y docker
        service docker start
        usermod -a -G docker ec2-user
        chkconfig docker on

        # Install Docker Compose
        curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose

        # Install AWS CLI if not already installed
        if ! command -v aws &> /dev/null; then
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install
        fi

        # Create app directory if it doesn't exist
        mkdir -p /home/ec2-user/employees-management-system
        EOL

      # Create configure_application.sh
      - |
        cat > scripts/configure_application.sh << 'EOL'
        #!/bin/bash
        echo "Configuring application..."

        # Navigate to the application directory
        cd /home/ec2-user/employees-management-system

        # Create docker-compose.prod.yml file if it doesn't exist
        if [ ! -f docker-compose.prod.yml ]; then
            cat > docker-compose.prod.yml << 'EOF'
        services:
          postgres:
            image: postgres:13-alpine
            container_name: ems-db
            ports:
              - "5432:5432"
            environment:
              POSTGRES_USER: ${DB_USER:-root}
              POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
              POSTGRES_DB: ${DB_NAME:-employees_management_system}
            volumes:
              - postgres-data:/var/lib/postgresql/data
            healthcheck:
              test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-employees_management_system}" ]
              interval: 10s
              timeout: 5s
              retries: 5
            restart: unless-stopped
            networks:
              - app-network

          app:
            image: ${ECR_REPOSITORY_URI:-djimy87/ems-app:v1}
            container_name: ems-app
            ports:
              - "8080:8080"
            depends_on:
              postgres:
                condition: service_healthy
            environment:
              SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-employees_management_system}
              SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
              SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
              SPRING_JPA_HIBERNATE_DDL_AUTO: update
              SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
            restart: unless-stopped
            networks:
              - app-network

        volumes:
          postgres-data:

        networks:
          app-network:
        EOF
        fi

        # Set proper permissions
        chmod 644 docker-compose.prod.yml
        echo "Application configuration complete"
        EOL

      # Create application_stop.sh
      - |
        cat > scripts/stop_application.sh << 'EOL'
        #!/bin/bash
        echo "Stopping application..."
        cd /home/ec2-user/employees-management-system

        # Stop containers if docker-compose file exists
        if [ -f docker-compose.prod.yml ]; then
          docker-compose -f docker-compose.prod.yml down || true
        fi

        # Clean up unused Docker resources
        docker system prune -f

        echo "Application stopped successfully"
        EOL

      # Create application_start.sh
      - |
        cat > scripts/start_application.sh << 'EOL'
        #!/bin/bash
        set -e

        echo "Starting application..."

        # Get instance region from instance metadata
        AWS_REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
        if [ -z "$AWS_REGION" ]; then
            # Default to us-east-1 if we can't determine the region
            AWS_REGION="us-east-1"
        fi
        echo "Using AWS Region: $AWS_REGION"

        # Try to determine the ECR repository URI dynamically if not set
        if [ -z "$ECR_REPOSITORY_URI" ]; then
            # Get the AWS account ID
            AWS_ACCOUNT_ID=$(curl -s http://169.254.169.254/latest/dynamic/instance-identity/document | grep -oP '(?<="accountId" : ")[^"]*')
            
            # If we get the account ID, try to construct the ECR URI
            if [ ! -z "$AWS_ACCOUNT_ID" ]; then
                # Try to find the repository name from the CodeDeploy deployment-group
                DEPLOYMENT_GROUP_NAME=$(cat /opt/codedeploy-agent/deployment-root/deployment-instructions/*/deployment-group-id 2>/dev/null || echo "")
                REPOSITORY_NAME=$(echo "$DEPLOYMENT_GROUP_NAME" | grep -oP '(?<=-)[^-]*$' 2>/dev/null || echo "ems-app")
                
                # Construct ECR repository URI
                ECR_REPOSITORY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORY_NAME}"
                echo "Determined ECR repository URI: $ECR_REPOSITORY_URI"
            else
                echo "Could not determine AWS account ID. Please set ECR_REPOSITORY_URI environment variable."
                exit 1
            fi
        fi

        echo "Using ECR repository: $ECR_REPOSITORY_URI"

        # Create .env file for docker-compose
        cat > /home/ec2-user/employees-management-system/.env << EOF
        ECR_REPOSITORY_URI=$ECR_REPOSITORY_URI
        DB_USER=root
        DB_PASSWORD=root
        DB_NAME=employees_management_system
        EOF

        # Login to AWS ECR
        echo "Logging in to ECR..."
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI

        # Navigate to application directory
        cd /home/ec2-user/employee-management-system

        # Check if we need to pull the image first
        echo "Pulling latest image from ECR..."
        docker pull $ECR_REPOSITORY_URI:latest || echo "Failed to pull image, will attempt to use cached version"

        # Start Docker containers
        echo "Starting containers..."
        docker-compose -f docker-compose.prod.yml up -d

        echo "Application started successfully"
        EOL

      - chmod +x scripts/install_dependencies.sh scripts/configure_application.sh scripts/stop_application.sh scripts/start_application.sh

      # Create appspec.yml
      - |
        cat > appspec.yml << 'EOL'
        version: 0.0
        os: linux
        files:
          - source: /
            destination: /home/ec2-user/employees-management-system
        hooks:
          BeforeInstall:
            - location: scripts/install_dependencies.sh
              timeout: 300
              runas: root
          AfterInstall:
            - location: scripts/configure_application.sh
              timeout: 300
              runas: root
          ApplicationStop:
            - location: scripts/stop_application.sh
              timeout: 300
              runas: root
          ApplicationStart:
            - location: scripts/start_application.sh
              timeout: 300
              runas: root
        EOL

artifacts:
  files:
    - appspec.yml
    - scripts/install_dependencies.sh
    - scripts/configure_application.sh
    - scripts/stop_application.sh
    - scripts/start_application.sh
    - imageDefinitions.json
