version: 0.2

phases:
  install:
    commands:
      - echo "Enabling Docker BuildKit"
      - export DOCKER_BUILDKIT=1

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Preparing build environment..."
      - mkdir -p scripts

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building Docker image without BuildKit-specific features..."
      - docker build --no-cache -t $ECR_REPOSITORY_URI:latest .
      - docker tag $ECR_REPOSITORY_URI:latest $ECR_REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Build completed on $(date)"
      - echo "Pushing Docker images..."
      - docker push $ECR_REPOSITORY_URI:latest
      - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG

      # Generate deployment artifacts
      - echo "Creating deployment artifacts..."
      - |
        cat > imageDefinitions.json << EOL
        [
          {
            "name": "${APP_NAME}-container",
            "imageUri": "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          }
        ]
        EOL

      - |
        cat > appspec.yml << EOL
        version: 0.0
        os: linux
        files:
          - source: /
            destination: /home/ec2-user/employee-management-system
        hooks:
          BeforeInstall:
            - location: scripts/before_install.sh
              timeout: 300
              runas: root
          AfterInstall:
            - location: scripts/after_install.sh
              timeout: 300
              runas: root
          ApplicationStart:
            - location: scripts/application_start.sh
              timeout: 300
              runas: root
          ApplicationStop:
            - location: scripts/application_stop.sh
              timeout: 300
              runas: root
        EOL

      # Create scripts
      - |
        cat > scripts/before_install.sh << EOL
        #!/bin/bash
        echo "Running before install hook"
        docker ps -aq | xargs -r docker stop | xargs -r docker rm || true
        rm -rf /home/ec2-user/employee-management-system/*
        mkdir -p /home/ec2-user/employee-management-system
        EOL

      - |
        cat > scripts/after_install.sh << EOL
        #!/bin/bash
        echo "Running after install hook"
        cd /home/ec2-user/employee-management-system
        echo "Writing docker-compose.yml"
        cat > docker-compose.yml << EOF
        version: '3.8'
        services:
          app:
            image: ${ECR_REPOSITORY_URI}:${IMAGE_TAG}
            ports:
              - "8080:8080"
            depends_on:
              - db
          db:
            image: postgres:13
            environment:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: employeedb
            volumes:
              - pgdata:/var/lib/postgresql/data
        volumes:
          pgdata:
        EOF
        EOL

      - |
        cat > scripts/application_start.sh << EOL
        #!/bin/bash
        echo "Starting application"
        cd /home/ec2-user/employee-management-system
        docker-compose up -d
        EOL

      - |
        cat > scripts/application_stop.sh << EOL
        #!/bin/bash
        echo "Stopping application"
        cd /home/ec2-user/employee-management-system
        docker-compose down || true
        EOL

      - chmod +x scripts/*.sh

artifacts:
  files:
    - appspec.yml
    - imageDefinitions.json
    - scripts/**/*
  name: deployment-artifacts-$(date +%Y%m%d%H%M%S)
